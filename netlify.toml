# Netlify configuration
#
# Contact form (contact.html):
#   The form is submitted via AJAX and handled by Netlify Forms.
#   It is auto-detected at deploy time because it carries the
#   data-netlify="true" attribute plus a hidden "form-name" input.
#   Spam is filtered via the data-netlify-honeypot "bot-field".
#   No build command or extra config is required for form handling —
#   Netlify's post-processing bot scans the static HTML on each deploy.

[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/devotionals"
  to = "/daily-word"
  status = 301

[[redirects]]
  from = "/devotionals.html"
  to = "/daily-word.html"
  status = 301

[[redirects]]
  from = "/devotionals/*"
  to = "/daily-word"
  status = 301

# Per-platform short links. Each one shows the links page, and Netlify
# Analytics counts it as its own page, so "Top pages" shows how many
# visits each platform sends.
#   /ig  = Instagram bio and captions
#   /fb  = Facebook Page (Pastor Olumide Oni)
#   /fbp = Facebook profile (Olumide Oni)
#   /yt  = YouTube descriptions and community posts
#   /wa  = WhatsApp shares
[[redirects]]
  from = "/ig"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/fb"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/fbp"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/yt"
  to = "/links.html"
  status = 200

[[redirects]]
  from = "/wa"
  to = "/links.html"
  status = 200
